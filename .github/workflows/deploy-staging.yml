name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    env:
      SSH_KEY: ${{ secrets.SSH_KEY_STAGING }}
      SSH_HOST: ${{ secrets.SSH_HOST_STAGING }}
      SSH_USER: ${{ secrets.SSH_USER_STAGING }}
      SSH_DEST_DIR: ${{ vars.SSH_DEST_DIR_STAGING }}
      STAGING_HTACCESS: ${{ vars.STAGING_HTACCESS }}
      STAGING_COMMON_CONFIG: ${{vars.STAGING_COMMON_CONFIG}}

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache image derivatives
        id: webp-cache
        uses: actions/cache@v4
        with:
          path: webp-cache.tar
          key: webp-${{ hashFiles('content/resources/media/**/*.jpg', 'content/resources/media/**/*.jpeg', 'content/resources/media/**/*.png', 'scripts/resources/constants.js') }}

      - name: Restore image derivatives
        if: steps.webp-cache.outputs.cache-hit == 'true'
        run: tar -xf webp-cache.tar

      - name: Build project
        run: npm run build

      - name: Process resources
        run: npm run resources

      - name: Pack image derivatives
        if: steps.webp-cache.outputs.cache-hit != 'true'
        run: find content/resources/media -name '*w.webp' -print0 | tar -cf webp-cache.tar --null -T -

      - name: Setup .htaccess
        run: echo "$STAGING_HTACCESS" > .htaccess

      - name: Setup common.config.json
        run: echo "$STAGING_COMMON_CONFIG" > common.config.json

      - name: Configure SSH setup
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST > ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          rsync -avz --delete --delete-excluded \
          --exclude='.git*' \
          --exclude='node_modules' \
          --exclude='package-lock.json' \
          --exclude='babel.config.js' \
          --exclude='eslint.config.js' \
          --exclude='prettier.config.js' \
          --exclude='tsconfig.json' \
          --exclude='webpack.config.js' \
          --exclude='scripts' \
          --exclude='webp-cache.tar' \
          --exclude='content/assets/src' \
          --exclude='content/*/*/assets/src' \
          --exclude='core/error/assets/src' \
          ./ $SSH_USER@$SSH_HOST:$SSH_DEST_DIR
